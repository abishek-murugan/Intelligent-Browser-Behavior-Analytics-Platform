$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: browser-analytics-env
description: >
  Azure ML managed environment for the browser behavior analytics pipeline.
  Built in the workspace container registry from a curated base image and a
  conda dependencies file (no local Docker, no Dockerfile). The CPU-only
  PyTorch wheel is installed directly from the PyPI CPU index so no CUDA
  packages are pulled in.
image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
conda_file: conda-dependencies.yml
