[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "time-based-browsing-pattern-analyzer"
version = "0.1.0"
description = "Deep learning analysis of time-based browsing patterns with RAM usage correlation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Abishek", email = "abishek@example.com" },
]
keywords = ["browsing", "deep-learning", "analytics", "lstm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.11.1",
    "mlflow==2.22.5",
    "mlflow-skinny==2.22.5",
    "optuna>=4.5.0",
    "pandas>=2.2.3,<3.0.0",
    "pyarrow==19.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "plotly>=6.6.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.54.0",
    "torch>=2.13.0",
    "azureml-mlflow>=1.60.0",
]

[project.urls]
Homepage = "https://github.com/abishek-murugan/Time-Based-Browsing-Pattern-Analyzer"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
