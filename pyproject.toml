[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "time-based-browsing-pattern-analyzer"
version = "0.1.0"
description = "Deep learning analysis of time-based browsing patterns with RAM usage correlation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Abishek", email = "abishek@example.com" },
]
keywords = ["browsing", "deep-learning", "analytics", "lstm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/abishek/time-based-browsing-pattern-analyzer"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
