name: Continuous Integration

on:
  push:
    branches:
      - master
      - "feature/**"

  pull_request:
    branches:
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12.13

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest
